name: CI

env:
  NODE_VERSION: 22.14.0
  NPM_VERSION: 10.9.2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -v ./internal/security -run TestSecretRedaction
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...

  web:
    name: Web Quality, Budgets & E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: test "$(node --version)" = "v${{ env.NODE_VERSION }}"
      - run: test "$(npm --version)" = "${{ env.NPM_VERSION }}"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - run: npm run budget:check
      - run: npm run report:dependencies
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:e2e:webkit

  docker:
    name: Docker Linux Image & Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp config.example.yaml config.yaml
      - run: docker build --tag 9gateway:ci .
      - name: Inspect non-root runtime contract
        run: |
          test "$(docker image inspect 9gateway:ci --format '{{.Config.User}}')" = "65532:65532"
          docker image inspect 9gateway:ci --format '{{json .Config.Healthcheck}}' | grep -q '/gateway'
      - name: Start stack and smoke readiness/UI
        env:
          UPSTREAM_API_KEY: ci-upstream-key
          ADMIN_CREDENTIAL: ci-admin-credential
          AUTH_PEPPER: ci-auth-pepper-012345678901234567890123456789
        run: |
          docker compose up -d --build
          trap 'docker compose down -v' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/ready && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/ready
          curl --fail --silent http://127.0.0.1:8080/ui/ | grep -qi '<!doctype html>'
