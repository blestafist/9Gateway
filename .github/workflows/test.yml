name: CI

env:
  NODE_VERSION: 22.14.0
  NPM_VERSION: 10.9.2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -v ./internal/security -run TestSecretRedaction
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...

  web:
    name: Web Quality, Budgets & E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: test "$(node --version)" = "v${{ env.NODE_VERSION }}"
      - run: test "$(npm --version)" = "${{ env.NPM_VERSION }}"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run budget:check
      - run: npm run report:dependencies
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
